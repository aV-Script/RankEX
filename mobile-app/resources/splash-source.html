<!DOCTYPE html>
<!--
  Sorgente splash PLACEHOLDER — vedi mobile-app/docs/MOBILE-APP.md → "Icone e splash".
  Canvas 2732x2732 (safe zone universale per @capacitor/assets): il contenuto
  utile resta in un'area centrale ~60% perché device diversi ritagliano il resto.
-->
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2732px; height: 2732px; background: #07090e; }
  .wrap {
    position: relative;
    width: 2732px; height: 2732px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .glow {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 1400px; height: 1400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(15,214,90,0.22), transparent 65%);
  }
  .center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .wordmark {
    margin-top: 48px;
    font-family: system-ui, Arial, sans-serif;
    font-weight: 900;
    font-size: 120px;
    letter-spacing: 10px;
    color: #ffffff;
  }
  .wordmark .accent { color: #1dff6b; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="center">
      <svg width="480" height="480" viewBox="0 0 100 100">
        <polygon points="50,6 92,38 76,90 24,90 8,38"
          fill="none" stroke="#2ecfff" stroke-width="2" opacity="0.5" />
        <polygon points="50,22 78,42 67,78 33,78 22,42"
          fill="none" stroke="#1dff6b" stroke-width="3" />
      </svg>
      <div class="wordmark">Rank<span class="accent">EX</span></div>
    </div>
  </div>
</body>
</html>
